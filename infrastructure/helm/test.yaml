ingress:
  enabled: true
  className: nginx
  hosts:
    - host: mobility.api.opendatahub.testingmachine.eu
      paths:
        - path: "/"
          pathType: Prefix
    - host: timeseries.api.opendatahub.testingmachine.eu
      paths:
        - path: "/"
          pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m

metrics:
  serviceMonitor:
    enabled: true

env:
  # Ninja
  NINJA_HOST_URL: "https://mobility.api.opendatahub.testingmachine.eu"
  NINJA_BASE_URL: "https://mobility.api.opendatahub.testingmachine.eu/v2"
  NINJA_QUERY_TIMEOUT_SEC: 60
  NINJA_HIKARI_LEAK_DETECTION_MS: 65000  # should be greater than (NINJA_QUERY_TIMEOUT_SEC * 1000)
  NINJA_RESPONSE_MAX_SIZE_MB: 100

  # Security
  SECURITY_ALLOWED_ORIGINS: "*"

  # Logging
  LOG_APPLICATION_NAME: odh-mobility-api
  LOG_APPLICATION_VERSION: <github sha>
  LOG_LEVEL: "info"
  LOG_STYLE: "json"
  ROOT_LOG_LEVEL: "info"

  # Quota: Requests per second
  NINJA_QUOTA_GUEST: 10
  NINJA_QUOTA_REFERER: 20
  NINJA_QUOTA_BASIC: 50
  NINJA_QUOTA_ADVANCED: 100
  NINJA_QUOTA_PREMIUM: 200

  # Quota: History range
  NINJA_QUOTA_HISTORY_GUEST: 5
  NINJA_QUOTA_HISTORY_REFERER: 100
  NINJA_QUOTA_HISTORY_BASIC: 1000
  NINJA_QUOTA_HISTORY_ADVANCED: 0
  NINJA_QUOTA_HISTORY_PREMIUM: 0
  NINJA_QUOTA_HISTORY_URL: https://github.com/noi-techpark/odh-docs/wiki/Api-Quota
  
  # Set JVM arguments
  # G1, not ZGC: this workload is millions of tiny, same-generation, immediately-dead row
  # objects (one Map per streamed row) - exactly what G1's young generation is cheap at
  # (single-digit-ms evacuation pauses reclaiming ~150M down to ~30M each cycle). ZGC pays real
  # memory overhead (region/relocation headroom) for guarantees this workload doesn't need -
  # measured on an identical request: G1 peaked at 378MiB / finished in 30s vs ZGC's 1748MiB /
  # 58s. Xmx is a small explicit ceiling (not MaxRAMPercentage of the 8Gi container limit) since
  # G1 doesn't need to be handed most of the container to perform well here; scaled up a bit from
  # the 1.5g tested to leave headroom for concurrent bursts (see loadsim results).
  JAVA_OPTS: -XX:+UseG1GC -Xmx3g -XX:MaxGCPauseMillis=200 -Xlog:gc

database:
  servicebindName: "postgres-read-svcbind"

oauth:
  url: "https://auth.opendatahub.testingmachine.eu/auth/"
  realm: "noi"
  clientId: "odh-mobility-v2"
  clientSecret:
  sslRequired: "none"
  
resources:
  requests:
    memory: 1Gi
  limits:
    memory: 4Gi
    